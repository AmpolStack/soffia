services:
  - type: web
    name: soffia-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: TRUST_PROXY
        value: "true"
      - key: APP_COOKIE_SAMESITE
        value: lax
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_AUTHENTICATION_NAME
        sync: false
      - key: APP_AUTHENTICATION_USERNAME
        sync: false
      - key: APP_AUTHENTICATION_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
