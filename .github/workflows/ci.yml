name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend, MCP and examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build local bundle
        run: npm run build

      - name: Build cloud bundle
        run: npm run build:cloud

      - name: Build single-file bundle
        run: npm run build:single

      - name: Validate example decks
        run: npm run validate:all

      - name: Test MCP server
        run: npm run test:mcp

  api:
    name: .NET API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: dotnet test server/Soffia.sln --configuration Release

      - name: End-to-end API tests
        run: npm run test:api
