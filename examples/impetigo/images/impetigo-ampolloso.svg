<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Impétigo ampolloso: ampollas flácidas en antebrazo</title>
  <desc id="desc">Ilustración clínica de un antebrazo con ampollas flácidas de contenido claro y algunas áreas de descamación.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9dfd2"/>
      <stop offset="1" stop-color="#cbb7a1"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#c98d6f"/>
      <stop offset="0.5" stop-color="#e8b391"/>
      <stop offset="1" stop-color="#f2c8a7"/>
    </linearGradient>
    <radialGradient id="blister" cx="35%" cy="28%" r="75%">
      <stop offset="0" stop-color="#fff9df"/>
      <stop offset="0.4" stop-color="#f2dfa6"/>
      <stop offset="0.78" stop-color="#d6b466"/>
      <stop offset="1" stop-color="#a77a35"/>
    </radialGradient>
    <radialGradient id="blister2" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.5" stop-color="#f3e5b7"/>
      <stop offset="1" stop-color="#c59a4a"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b26448"/>
      <stop offset="1" stop-color="#8e4933"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4e2f22" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <circle cx="180" cy="150" r="240" fill="#fff7ea" opacity="0.25" filter="url(#soft)"/>
  <circle cx="1030" cy="690" r="220" fill="#7d4e38" opacity="0.12" filter="url(#soft)"/>

  <g transform="rotate(-16 600 400)" filter="url(#shadow)">
    <path d="M188 540c70-118 232-244 430-306 116-36 226-40 318-12 58 18 86 48 72 84-10 26-40 40-84 46-72 10-160 34-248 82-132 72-226 166-276 224-38 44-78 62-116 48-50-18-78-74-96-166z" fill="url(#skin)"/>
    <path d="M210 568c74-122 230-240 418-300 112-34 218-40 306-14" fill="none" stroke="#a86a50" stroke-width="3" opacity="0.45"/>
    <path d="M268 622c54-76 156-160 274-222" fill="none" stroke="#f7d2b6" stroke-width="22" opacity="0.28" stroke-linecap="round"/>

    <g opacity="0.55" stroke="#8e5a40" stroke-width="2">
      <path d="M312 472c30-8 56-4 78 12" fill="none"/>
      <path d="M342 508c26-6 48-2 66 10" fill="none"/>
      <path d="M290 520c20-4 38 0 52 10" fill="none"/>
      <path d="M402 438c18-6 34-4 48 6" fill="none"/>
    </g>

    <g filter="url(#shadow)">
      <ellipse cx="512" cy="388" rx="92" ry="70" fill="url(#blister)" stroke="#9a6a2e" stroke-width="5"/>
      <ellipse cx="512" cy="388" rx="72" ry="52" fill="none" stroke="#fff8d8" stroke-width="4" opacity="0.6"/>
      <path d="M474 360c18-12 42-16 62-8" fill="none" stroke="#fffdf0" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

      <ellipse cx="682" cy="344" rx="72" ry="56" fill="url(#blister2)" stroke="#9a6a2e" stroke-width="5"/>
      <path d="M650 322c14-10 32-12 48-6" fill="none" stroke="#fffdf0" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

      <path d="M576 496c34-24 76-28 108-10 22 12 28 32 12 46-20 18-58 20-88 4-24-13-42-30-32-40z" fill="#e7c77f" stroke="#9a6a2e" stroke-width="5"/>
      <path d="M592 496c28-10 58-8 82 4" fill="none" stroke="#fff8d8" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
      <path d="M594 534c20 10 44 12 64 4" fill="none" stroke="#b26448" stroke-width="5" stroke-linecap="round"/>

      <ellipse cx="418" cy="468" rx="44" ry="34" fill="url(#blister2)" stroke="#9a6a2e" stroke-width="4" opacity="0.9"/>
      <ellipse cx="790" cy="430" rx="34" ry="27" fill="url(#blister)" stroke="#9a6a2e" stroke-width="4" opacity="0.85"/>
    </g>

    <g fill="#b26448" opacity="0.7">
      <path d="M360 414c12-10 26-12 38-4 8 6 8 16-2 21-12 6-28 2-36-6-5-5-5-8 0-11z"/>
      <path d="M748 510c12-8 26-8 36 0 7 6 5 15-4 19-12 5-26 0-33-7-5-5-4-9 1-12z"/>
      <path d="M470 590c10-7 22-7 30 0 6 6 3 14-5 17-10 4-22 0-28-6-4-4-3-8 3-11z"/>
    </g>

    <g fill="#fff6d8" opacity="0.9">
      <circle cx="478" cy="352" r="7"/>
      <circle cx="650" cy="316" r="6"/>
      <circle cx="540" cy="368" r="4"/>
      <circle cx="704" cy="332" r="4"/>
    </g>
  </g>

  <g opacity="0.55" fill="#3c2a21">
    <text x="64" y="732" font-family="Inter, Arial, sans-serif" font-size="20" letter-spacing="2">ILUSTRACIÓN CLÍNICA</text>
    <text x="64" y="760" font-family="Inter, Arial, sans-serif" font-size="15" opacity="0.75">Ampollas flácidas, algunas con colapso de la techumbre</text>
  </g>
</svg>
