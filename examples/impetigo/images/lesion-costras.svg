<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Impétigo no ampolloso: costras melicéricas perinasales</title>
  <desc id="desc">Ilustración clínica de un rostro infantil con placas eritematosas y costras doradas alrededor de la nariz y la boca.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe5d8"/>
      <stop offset="1" stop-color="#d8c3ad"/>
    </linearGradient>
    <radialGradient id="skin" cx="45%" cy="38%" r="70%">
