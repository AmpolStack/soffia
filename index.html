<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link
      rel="alternate"
      type="text/plain"
      href="/llms.txt"
      title="soffia format guide for models"
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https: ws: wss:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem('soffia:settings') || '{}');
        var theme = stored.theme === 'light' ? 'light' : 'dark';
        var root = document.documentElement;
        root.dataset.theme = theme;
        root.dataset.accent = stored.accent === 'green' ? 'green' : 'blue';
        root.dataset.fontScale =
          stored.fontScale === 'compact' || stored.fontScale === 'large'
            ? stored.fontScale
            : 'normal';
        root.dataset.reduceMotion = stored.reduceMotion ? 'true' : 'false';
        root.style.colorScheme = theme;
      } catch (error) {
        // Sin configuración previa: se usa el tema oscuro por defecto.
      }
    </script>
    <meta
      name="description"
      content="soffia — convierte contenido generado por IA en material de estudio."
    />
    <title>soffia</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
